name: Olenara paper trader
on:
  workflow_dispatch:
    inputs:
      strategy_date:
        description: "策略对应的交易日 YYYY-MM-DD"
        required: true
        default: "2026-10-12"
  schedule:
    # Start before the opening auction: 09:20 China Standard Time (UTC+8).
    - cron: "20 1 * * 1-5"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve strategy date
        id: date
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.strategy_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run intraday paper session
        if: github.event_name == 'schedule'
        run: |
          python -m src.session --strategy-date "${{ steps.date.outputs.value }}"
      - name: Refresh data and run requested-date simulation
        if: github.event_name == 'workflow_dispatch'
        run: python -m src.main --strategy-date "${{ steps.date.outputs.value }}" --dry-run
      - name: Upload reports and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trader-report
          path: |
            reports/
            data/signals/
            data/market/
          if-no-files-found: warn
          retention-days: 90

